# 大模型配置
llm_config:
  base_url: "https://api.deepseek.com/anthropic"
  api_key: ""
  model_name: "deepseek-v4pro"

# MCP 工具服务配置
mcp_config:
  mcpServers:
    # 本地 Shell 沙箱服务（stdio 传输模式）
    shell:
      transport: "stdio"
      enabled: true
      description: "Linux OverlayFS 沙箱命令执行工具"
      env: {}
      command: "sudo"
      args: ["uv", "run", "./tool/shell.py"]

# A2A 远程智能体配置
a2a_config:
  a2aServers: []

llm_config:
  max_context_tokens: 128000
  compress_threshold: 0.75
