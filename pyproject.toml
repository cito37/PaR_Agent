
[project]
name = "agent1"
version = "0.1.0"
description = "A multi-agent workflow system based on PlanAgent + ReActAgent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.54.0",
    "mcp==1.22.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "redis>=5.2.1",
    "httpx>=0.27.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "a2a-sdk>=0.1.0",
    "filelock>=3.16.1",
    "json-repair>=0.23.1",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "mod", "tool"]